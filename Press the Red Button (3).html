<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Red Button">

<title>Press the Red Button</title>

<style>
* {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
        radial-gradient(circle at center,
        #fafafa 0%,
        #e5e5e5 60%,
        #d0d0d0 100%);
}

.container {
    text-align: center;
    padding: 20px;
}

h1 {
    color: #222;
    margin-bottom: 40px;
    font-size: clamp(1.8rem, 4vw, 3rem);
}

.button-base {
    width: min(70vw, 300px);
    height: min(70vw, 300px);
    background: #555;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow:
        0 25px 40px rgba(0,0,0,.35),
        inset 0 8px 12px rgba(255,255,255,.25);
}

#redButton {
    width: 85%;
    height: 85%;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    outline: none;

    background:
        radial-gradient(circle at 35% 25%,
        #ffbcbc 0%,
        #ff6363 20%,
        #ff0000 45%,
        #b10000 75%,
        #6f0000 100%);

    box-shadow:
        inset 0 12px 18px rgba(255,255,255,.45),
        inset 0 -12px 18px rgba(0,0,0,.35),
        0 12px 18px rgba(0,0,0,.3);

    transition:
        transform .08s ease,
        box-shadow .08s ease;
}

#redButton:active {
    transform: translateY(10px);
    box-shadow:
        inset 0 5px 10px rgba(255,255,255,.25),
        inset 0 -5px 10px rgba(0,0,0,.4);
}

#counter {
    margin-top: 30px;
    color: #444;
    font-size: 1rem;
    font-weight: 500;
}
</style>
</head>

<body>

<div class="container">

    <h1>Press the Red Button</h1>

    <div class="button-base">
        <button id="redButton" aria-label="Press the Red Button"></button>
    </div>

    <div id="counter"></div>

</div>

<script>
const STORAGE_KEY = "redButtonCount";

let count =
    Number(localStorage.getItem(STORAGE_KEY)) || 0;

const counter =
    document.getElementById("counter");

function updateCounter() {
    counter.textContent =
        "Your personal press count: " + count;
}

updateCounter();

function playClick() {
    try {
        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx = new AudioCtx();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "square";
        osc.frequency.value = 180;

        osc.connect(gain);
        gain.connect(ctx.destination);

        gain.gain.setValueAtTime(
            0.15,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.10
        );

        osc.start();
        osc.stop(ctx.currentTime + 0.10);
    } catch (e) {
        console.log("Audio unavailable");
    }
}

document
.getElementById("redButton")
.addEventListener("click", () => {

    count++;

    localStorage.setItem(
        STORAGE_KEY,
        count
    );

    updateCounter();
    playClick();
});
</script>

</body>
</html>
